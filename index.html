<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="/core/ui/ui.css" />
  <title>Cards Training</title>
  <meta name="description"
    content="Увлажняющий мусс глубоко увлажняет кожу лица, оставляя её мягкой и гладкой. Состав: натуральные комплексы, витамины C, A, PP, B, E и солнцезащитные компоненты. Цена: 2 750 ₽." />
</head>

<body>
  <section class="product-card-wrapper" id="product-card-prompt-wrapper"></section>

  <section class="button-wrapper">
    <button id="recolor-first-el-card-button" class="btn">
      Перекрасить фон первой карточки
    </button>
    <button id="open-google-button" class="btn">
      Перейти на страницу Google
    </button>
    <button id="recolor-all-el-card-button" class="btn">
      Перекрасить фон всех карточек
    </button>
    <button id="click-recolor-button" class="btn">
      Поменять цвет кнопки
    </button>
  </section>

  <template id="product-card-template">
    <article class="product-card">
      <img class="product-card__image" />
      <p class="product-card__type-skin"></p>
      <h3 class="product-card__name"></h3>
      <p class="product-card__descr"></p>
      <span class="product-card__composition-text">Состав:</span>
      <ul class="product-card__composition"></ul>
      <div class="product-card__price-wrapper">
        <span class="product-card__price-text">Цена</span>
        <span class="product-card__price-value"></span>
      </div>
    </article>
  </template>

  <button class="modal-btn btn">Регистрация</button>

  <div class="modal" id="registration-modal">
    <form class="registration-form">
      <h3 class="registration-form__title">Регистрация</h3>
      <button class="close-modal-btn" type="button">X</button>
      <div class="form-group">
        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" placeholder="Введите имя" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="surname">Фамилия:</label>
        <input type="text" id="surname" name="surname" placeholder="Введите фамилию" required autocomplete="surname" />
      </div>

      <div class="form-group">
        <label for="birthday">Дата рождения:</label>
        <input type="date" id="birthday" name="birthday" required autocomplete="bithday" />
      </div>

      <div class="form-group">
        <label for="login">Логин:</label>
        <input type="text" id="login" name="login" placeholder="Придумайте логин" required autocomplete="login" />
      </div>

      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" placeholder="Придумайте пароль" required minlength="6"
          autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="passwordRepeat">Повторение пароля:</label>
        <input type="password" id="password-repeat" name="passwordRepeat" placeholder="Повторите пароль" required
          autocomplete="new-password">
      </div>

      <button type="submit" class="registration-form__submit-button">
        Зарегистрироваться
      </button>
    </form>

    <div class="overlay"></div>
  </div>

  <template id="registration-form-template"> </template>


  <footer>
    <div class="promo-subscribe-wrapper" aria-labelledby="subscribe-heading">
      <div class="slogan-container">
        <h2 class="slogan-container__title">Product cards</h2>
        <p>У нас самые лучшие продукты для кожи!</p>
        <div class="logo-container">
          <img src="/assets/svg/tg.svg" alt="Логотип telegram" />
          <img src="/assets/svg/vk.svg" alt="Логотип vkontakte" />
        </div>
      </div>
      <div class="subscribe-container">
        <label for="email-input"> Подпишись на наши акции: </label>
        <form class="subscribe-form" id="subscribe-form">
          <input type="email" name="email" placeholder="Введи Email..." required />
          <button type="submit">Подписаться</button>
        </form>
      </div>
      <div class="quick-links-container">
        <nav>
          <p class="quick-links-container__description">Быстрые ссылки</p>
          <ul class="quick-links">
            <li><a class="quick-links__link" href="#">Главная</a></li>
            <li><a class="quick-links__link" href=" #">Магазин</a></li>
            <li><a class="quick-links__link" href=" #">Контакты</a></li>
          </ul>
        </nav>
      </div>
    </div>
    <p class="copyright-info">www.product-cards.com©all right reserve</p>
  </footer>

  <script src="/core/scripts/homework-5.js"></script>
  <script src="/core/scripts/homework-6.js"></script>
  <script src="/core/scripts/homework-7/homework-7.js" type="module"></script>
  <script src="/core/scripts/homework-8/homework-8.js" type="module"></script>
  <script src="/core/scripts/homework-9/homework-9.js" type="module"></script>
</body>

</html>
