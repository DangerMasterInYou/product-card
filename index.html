<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="/core/ui/ui.css">
    <title>Cards Training</title>
    <meta name="description"
        content="Увлажняющий мусс глубоко увлажняет кожу лица, оставляя её мягкой и гладкой. Состав: натуральные комплексы, витамины C, A, PP, B, E и солнцезащитные компоненты. Цена: 2 750 ₽.">
</head>

<body>
    <section>
        <span class="title">Template products:</span>
        <section class="product-card-wrapper" id="product-card-template-wrapper"></section>

        <span class="title">Prompt template products:</span>
        <section class="product-card-wrapper" id="product-card-prompt-wrapper"></section>
    </section>

    <section class="button-wrapper">
        <button id="recolor-first-el-card-button" class="btn">Перекрасить фон первой карточки</button>
        <button id="open-google-button" class="btn">Перейти на страницу Google</button>
        <button id="recolor-all-el-card-button" class="btn">Перекрасить фон всех карточек</button>
        <button id="click-recolor-button" class="btn">Поменять цвет кнопки</button>
    </section>

    <template id="product-card-template">
        <article class="product-card">
            <img class="product-card__image">
            <p class="product-card__type-skin"></p>
            <h3 class="product-card__name"></h3>
            <p class="product-card__descr"></p>
            <span class="product-card__composition-text">Состав:</span>
            <ul class="product-card__composition"></ul>
            <div class="product-card__price-wrapper">
                <span class="product-card__price-text">Цена</span>
                <span class="product-card__price-value"></span>
            </div>
        </article>
    </template>

    <script src="/core/scripts/homework-old.js"></script>
    <script src="/core/scripts/homework-5.js"></script>
    <script src="/core/scripts/homework-6.js"></script>
    <script src="/core/scripts/homework-7/homework-7.js" type="module"></script>
    <script src="/core/scripts/homework-8/homework-8.js" type="module"></script>
</body>

</html>
